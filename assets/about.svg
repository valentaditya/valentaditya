<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2033"/>
      <stop offset="100%" stop-color="#0b1622"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ec8e3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd9b3" stop-opacity="0.35"/>
    </linearGradient>
    <style>
      .m { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Noto Sans Mono', 'Noto Sans JP', monospace; font-size: 17px; }
      .ln { fill: #3d5a73; }
      .kw { fill: #f4a68c; }
      .id { fill: #ffffff; font-weight: 600; }
      .k  { fill: #7ec8e3; }
      .s  { fill: #ffd9b3; }
      .p  { fill: #8aa9bf; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .line { animation: in .5s ease-out both; }
      @keyframes in { from { opacity: 0; transform: translateX(-8px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="338" rx="16" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M1 17 A16 16 0 0 1 17 1 H883 A16 16 0 0 1 899 17 V46 H1 Z" fill="#7ec8e3" fill-opacity="0.07"/>
  <circle cx="28" cy="24" r="6" fill="#f4a68c"/>
  <circle cx="48" cy="24" r="6" fill="#ffd9b3"/>
  <circle cx="68" cy="24" r="6" fill="#7ec8e3"/>
  <text class="m" x="450" y="29" text-anchor="middle" font-size="14" fill="#8aa9bf">valent.js</text>

  <g class="m">
    <g class="line" style="animation-delay:.05s"><text x="28" y="90" class="ln">1</text><text x="70" y="90"><tspan class="kw">const</tspan><tspan class="id" dx="10">valent</tspan><tspan class="p" dx="10">= {</tspan></text></g>
    <g class="line" style="animation-delay:0.15s"><text x="28" y="120" class="ln">2</text><text x="100" y="120"><tspan class="k">role</tspan><tspan class="p">:</tspan></text><text x="225" y="120"><tspan class="s">"Software Engineering Student"</tspan><tspan class="p">,</tspan></text></g>
    <g class="line" style="animation-delay:0.25s"><text x="28" y="150" class="ln">3</text><text x="100" y="150"><tspan class="k">location</tspan><tspan class="p">:</tspan></text><text x="225" y="150"><tspan class="s">"Indonesia"</tspan><tspan class="p">,</tspan></text></g>
    <g class="line" style="animation-delay:0.35s"><text x="28" y="180" class="ln">4</text><text x="100" y="180"><tspan class="k">learning</tspan><tspan class="p">:</tspan></text><text x="225" y="180"><tspan class="p">[</tspan><tspan class="s">"Node.js"</tspan><tspan class="p">, </tspan><tspan class="s">"Express"</tspan><tspan class="p">, </tspan><tspan class="s">"REST API"</tspan><tspan class="p">, </tspan><tspan class="s">"React"</tspan><tspan class="p">],</tspan></text></g>
    <g class="line" style="animation-delay:0.45s"><text x="28" y="210" class="ln">5</text><text x="100" y="210"><tspan class="k">interests</tspan><tspan class="p">:</tspan></text><text x="225" y="210"><tspan class="p">[</tspan><tspan class="s">"Web Dev"</tspan><tspan class="p">, </tspan><tspan class="s">"Mobile (APK)"</tspan><tspan class="p">, </tspan><tspan class="s">"Anime"</tspan><tspan class="p">],</tspan></text></g>
    <g class="line" style="animation-delay:0.55s"><text x="28" y="240" class="ln">6</text><text x="100" y="240"><tspan class="k">org</tspan><tspan class="p">:</tspan></text><text x="225" y="240"><tspan class="s">"@PISD-X-ANDIMA"</tspan><tspan class="p">,</tspan></text></g>
    <g class="line" style="animation-delay:0.65s"><text x="28" y="270" class="ln">7</text><text x="100" y="270"><tspan class="k">motto</tspan><tspan class="p">:</tspan></text><text x="225" y="270"><tspan class="s">"calm like the morning sea."</tspan><tspan class="p">,</tspan></text></g>
    <g class="line" style="animation-delay:.75s"><text x="28" y="300" class="ln">8</text><text x="70" y="300"><tspan class="p">};</tspan></text></g>
    <rect class="cursor" x="94" y="286" width="9" height="18" fill="#7ec8e3"/>
  </g>

  <!-- little wave accent -->
  <path d="M760 300 q10 -8 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#7ec8e3" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="850" cy="300" r="4" fill="#ffd9b3"/>
</svg>
