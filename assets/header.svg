<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1622"/>
      <stop offset="40%" stop-color="#15304d"/>
      <stop offset="75%" stop-color="#3f6f96"/>
      <stop offset="100%" stop-color="#f2c4a2"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7ea6"/>
      <stop offset="45%" stop-color="#1d4468"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4e3"/>
      <stop offset="55%" stop-color="#ffd9b3"/>
      <stop offset="100%" stop-color="#ffb889"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9b3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd9b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8dcf0"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', 'Noto Sans', 'Noto Sans JP', Arial, sans-serif; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      .glow { animation: breathe 5s ease-in-out infinite; transform-origin: 920px 250px; }
      @keyframes breathe { 0%,100% { opacity: .7; transform: scale(1) } 50% { opacity: 1; transform: scale(1.08) } }
      .shine { animation: shimmer 2.6s ease-in-out infinite; }
      .sh2 { animation-delay: .8s; } .sh3 { animation-delay: 1.6s; }
      @keyframes shimmer { 0%,100% { opacity: .25 } 50% { opacity: .8 } }
      .w1 { animation: drift 14s linear infinite; }
      .w2 { animation: drift 9s linear infinite reverse; }
      .w3 { animation: drift 6s linear infinite; }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-600px) } }
      .gull { animation: fly 8s ease-in-out infinite; }
      .g2 { animation-delay: 1.5s; }
      @keyframes fly { 0%,100% { transform: translate(0,0) } 50% { transform: translate(14px,-8px) } }
      .fade { animation: fadeUp 1.2s ease-out both; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .45s }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    </style>
  </defs>

  <!-- sky -->
  <rect width="1200" height="252" fill="url(#sky)"/>

  <!-- faint morning stars -->
  <g fill="#e6f4ff">
    <circle class="star" cx="620" cy="40" r="1.6"/>
    <circle class="star s2" cx="700" cy="78" r="1.2"/>
    <circle class="star s3" cx="1040" cy="36" r="1.5"/>
    <circle class="star" cx="1130" cy="90" r="1.1"/>
    <circle class="star s2" cx="820" cy="28" r="1.3"/>
    <circle class="star s3" cx="560" cy="96" r="1"/>
  </g>

  <!-- seagulls -->
  <g fill="none" stroke="#eaf6fc" stroke-width="2" stroke-linecap="round">
    <path class="gull" d="M760 120 q7 -7 14 0 q7 -7 14 0"/>
    <path class="gull g2" d="M800 98 q5 -5 10 0 q5 -5 10 0"/>
    <path class="gull" d="M1060 140 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- rising sun -->
  <circle class="glow" cx="920" cy="250" r="150" fill="url(#glow)"/>
  <circle cx="920" cy="250" r="58" fill="url(#sun)"/>

  <!-- sea -->
  <rect y="250" width="1200" height="130" fill="url(#sea)"/>

  <!-- sun reflection -->
  <g fill="#ffe0c2">
    <rect class="shine" x="870" y="258" width="100" height="3" rx="1.5"/>
    <rect class="shine sh2" x="888" y="268" width="64" height="3" rx="1.5"/>
    <rect class="shine sh3" x="900" y="279" width="40" height="2.5" rx="1.25"/>
    <rect class="shine" x="910" y="290" width="20" height="2" rx="1"/>
  </g>

  <!-- waves (period 600px, path 1800px wide so the drift loops seamlessly) -->
  <g class="w1" opacity="0.55">
    <path fill="#5d93bb" d="M0 292 Q150 282 300 292 T600 292 T900 292 T1200 292 T1500 292 T1800 292 V380 H0 Z"/>
  </g>
  <g class="w2" opacity="0.8">
    <path fill="#22507a" d="M0 318 Q150 304 300 318 T600 318 T900 318 T1200 318 T1500 318 T1800 318 V380 H0 Z"/>
  </g>
  <g class="w3">
    <path fill="#0d1117" d="M0 352 Q150 336 300 352 T600 352 T900 352 T1200 352 T1500 352 T1800 352 V380 H0 Z"/>
  </g>

  <!-- text -->
  <g class="t">
    <g class="fade">
      <rect x="80" y="58" width="168" height="30" rx="15" fill="#7ec8e3" fill-opacity="0.14" stroke="#7ec8e3" stroke-opacity="0.6"/>
      <text x="164" y="78" text-anchor="middle" font-size="14" fill="#bfe6f5" letter-spacing="2">朝凪 · asanagi</text>
    </g>
    <text class="fade d1" x="78" y="150" font-size="58" font-weight="700" fill="url(#title)">Hi, I'm Valent</text>
    <text class="fade d2" x="80" y="190" font-size="20" fill="#d4ebf6">Software Engineering Student · Web &amp; JavaScript Developer</text>
    <text class="fade d2" x="80" y="222" font-size="15" fill="#d4ebf6" fill-opacity="0.75" font-style="italic">calm like the morning sea, steady like the tide.</text>
  </g>
</svg>
